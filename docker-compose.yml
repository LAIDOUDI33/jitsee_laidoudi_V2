# ============================================================================
# ALVISION — Docker Compose for Production Deployment
# ============================================================================
# Usage:
#   cp .env.example .env   # Edit with production values
#   docker compose up -d    # Start all services
#   docker compose logs -f  # Follow logs
#   docker compose down     # Stop all services
# ============================================================================

services:
  # ---- Next.js Application ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alvision-web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/custom.db
    volumes:
      # Persist SQLite database across container restarts
      - data:/app/data
    depends_on:
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - alvision-net

  # ---- WebSocket Chat Service ----
  chat-service:
    build:
      context: ./mini-services/chat-service
      dockerfile: Dockerfile
    container_name: alvision-chat
    ports:
      - "3010:3010"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - alvision-net

volumes:
  data:
    name: alvision-data

networks:
  alvision-net:
    name: alvision-network
    driver: bridge
